# General configuration
experiment:
  name: PowerForecasting_STL_VMD
  seed: 42 # change value
  device: "cuda"  # "cuda" or "cpu"
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  early_stopping_patience: 30
  scheduler_patience: 3
  scheduler_factor: 0.5

# Dataset configuration
data:
  # root_path: "data/processed/dataset_Laundry_modified.csv"
  root_path: "data/processed/dataset_figshare_processed.csv"
  # target: "Active_Power" # for Yulara
  target: "Power (MW)" # for figshare
  sequence_length: 48
  prediction_length: 1
  train_split: 0.6
  val_split: 0.2
  test_split: 0.2
  normalization: "minmax" 
  shuffle: true

# STL decomposition parameters
stl:
  enabled: true # False to not use STL
  period: 9 
  robust: true
  rolling_window: false 


# Model configuration
model:
  name: "TimesNet_BiLSTM"
  input_features: 6 # switch to 3 if STL is deactivated
  output_features: 1

  timesnet:
    d_model: 32
    d_ff: 8
    num_kernels: 7 
    num_times_blocks: 2
    top_k: 2 
    dropout: 0.1188

  bilstm:
    hidden_size: 32
    layers: 3
    bidirectional: true

# Training options
training:
  optimizer: "adam"
  loss_function: "mse"
  metrics: ["mae", "rmse", "r2"]
  checkpoint_dir: "outputs/models"
  save_best_only: true
  verbose: true
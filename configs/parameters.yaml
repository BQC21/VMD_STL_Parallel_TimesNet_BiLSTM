# General configuration
experiment:
  name: PowerForecasting_STL_VMD
  seed: 42
  device: "cuda"  # "cuda" or "cpu"
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  early_stopping_patience: 30

# Dataset configuration
data:
  root_path: "data/dataset_Laundry_modified.csv"
  target: "Active_Power" # DKSAC
  sequence_length: 48
  prediction_length: 1

# STL decomposition parameters
stl:
  enabled: true
  period: 9 

# Model configuration
model:
  name: "TimesNet_BiLSTM"
  input_features: 11 # switch to 8 if STL are disabled (DKASC)
  output_features: 1

  timesnet:
    d_model: 32
    d_ff: 8
    num_kernels: 5
    num_times_blocks: 2
    top_k: 3
    dropout: 0.1188

  bilstm:
    hidden_size: 32
    layers: 3
    bidirectional: true

# Training options
training:
  optimizer: "adam"
  loss_function: "mse"
  metrics: ["mae", "rmse", "r2"]

  checkpoint_dir: "outputs/Yulara/models"
  model_dir: "STL_TimesNet_BiLSTM"
  model_name_file: "STL_TimesNet_BiLSTM_best_model.pt"

  save_best_only: true
  verbose: true